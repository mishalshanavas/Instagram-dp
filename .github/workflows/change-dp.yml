name: Update Instagram DP

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check setup first, or change your picture now'
        type: choice
        options:
          - check
          - rotate
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-dp
  cancel-in-progress: false

jobs:
  update-dp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository != 'mishalshanavas/Instagram-dp' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          SHOULD_RUN=true
          if [[ "$EVENT_NAME" == schedule && -f data/next_run.txt ]]; then
            NEXT_RUN=$(cat data/next_run.txt)
            if [[ "$NEXT_RUN" =~ ^[0-9]{1,12}$ ]]; then
              if (( $(date +%s) < 10#$NEXT_RUN )); then
                SHOULD_RUN=false
              fi
            else
              echo 'Invalid schedule; running now to repair it.'
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Check setup secret
        if: steps.schedule.outputs.should_run == 'true'
        env:
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
        run: |
          if [ -z "$INSTA_SESSION" ]; then
            echo '::error::Setup needed: run python setup.py locally, then add INSTA_SESSION under Settings → Secrets and variables → Actions.'
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        if: steps.schedule.outputs.should_run == 'true'
        run: python -m pip install -r src/requirements.txt

      - name: Validate setup or rotate picture
        if: steps.schedule.outputs.should_run == 'true'
        env:
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = check ]; then
            python src/main.py --check
          else
            python src/main.py
          fi

      - name: Save next run and image position
        if: steps.schedule.outputs.should_run == 'true' && inputs.mode != 'check'
        shell: bash
        run: |
          python - <<'PY'
          import random
          import time
          from pathlib import Path
          Path('data/next_run.txt').write_text(str(int(time.time()) + random.randint(7200, 18000)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/index.txt data/next_run.txt
          git diff --staged --quiet && exit 0
          git commit -m 'Update picture rotation state [skip ci]'
          git pull --rebase
          git push

      - name: Show result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_MODE: ${{ inputs.mode }}
          SHOULD_RUN: ${{ steps.schedule.outputs.should_run }}
        run: |
          if [ "$JOB_STATUS" != success ]; then
            echo 'Setup/update failed. Read the failed step above. For an expired session, rerun python setup.py and replace INSTA_SESSION.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SHOULD_RUN" = false ]; then
            echo 'Skipped: the next picture change is not due yet.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RUN_MODE" = check ]; then
            echo 'Setup validated. No profile picture was changed. Run again with mode rotate, or wait for the schedule.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Profile picture updated. The next change is due in 2–5 hours, checked hourly.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Display schedule in your timezone
        if: always()
        run: python3 src/timezone_setup.py
